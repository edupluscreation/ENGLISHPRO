<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/app_icon_mobile.jpg" />
    <link rel="apple-touch-icon" href="/app_icon_mobile.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>SSC English PRO — 18,000+ PYQs & AI Grammar</title>
    <meta name="description" content="SSC English Pro - 18,000+ Official SSC PYQs, 120 Golden Rules, Vocab Bank & AI Grammar Checker." />
    <meta property="og:image" content="/app_icon_mobile.jpg" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #000000;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow-x: hidden;
      }
      #app-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #000000;
        color: #ffffff;
        z-index: 99999;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }
      .loader-logo {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        overflow: hidden;
        margin-bottom: 16px;
        box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
      }
      .loader-logo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .loader-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 20px auto 0 auto;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-loader">
        <div class="loader-logo">
          <img src="/app_icon_mobile.jpg" alt="SSC English Pro Logo" />
        </div>
        <div style="font-size: 22px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 6px; color: #ffffff;">
          SSC English PRO
        </div>
        <div style="font-size: 13px; color: #a1a1aa; font-weight: 500;">
          18,000+ PYQs • 120 Rules • AI Grammar
        </div>
        <div class="loader-spinner"></div>
      </div>
    </div>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
